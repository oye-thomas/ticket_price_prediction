[project]
name = "ticket-price-prediction"
version = "0.1.0"
description = "prediction de prix de billet d'avion"
authors = [
    {name = "Thomas",email = "alabythomas@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "great-expectations (>=1.23.2,<2.0.0)",
    "scipy (>=1.18.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
